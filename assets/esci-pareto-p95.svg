<text class="small" x="191.8" y="510" text-anchor="middle">108.0</text>
<text class="small" x="76" y="414.8" text-anchor="end">0.3221</text>
<path class="grid" d="M297.6 94V490 M86 331.6H615"/>
<text class="small" x="297.6" y="510" text-anchor="middle">182.1</text>
<text class="small" x="76" y="335.6" text-anchor="end">0.3578</text>
