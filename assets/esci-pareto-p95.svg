<circle cx="218.2" cy="208.5" r="5" fill="#087859"><title>Passage BM25 + fuzzy title/brand: 106.557 ms, 0.375884 NDCG</title></circle>
<circle cx="664" cy="296" r="4" fill="#087859"/>
