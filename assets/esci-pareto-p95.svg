<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 510" role="img" aria-labelledby="title desc">
<title id="title">ESCI relevance vs. latency</title>
<desc id="desc">p95 latency in milliseconds versus NDCG at 10. Lower latency and higher NDCG are better.</desc>
<style>text{font:14px system-ui,sans-serif;fill:#172438}.small{font-size:12px;fill:#43546b}.heading{font-size:23px;font-weight:bold}.axis{stroke:#73829a}.grid{stroke:#dfe6ee}</style>
<rect width="100%" height="100%" rx="12" fill="#f6f8fb"/>
<text x="32" y="40" class="heading">ESCI relevance vs. latency</text>
<text x="32" y="64" class="small">15 measured; 0 pending. Faster and more relevant is upper left.</text>
<path class="grid" d="M86.0 94V440 M86 440.0H615"/>
<text class="small" x="86.0" y="460" text-anchor="middle">42.3</text>
<text class="small" x="76" y="444.0" text-anchor="end">0.2865</text>
<path class="grid" d="M191.8 94V440 M86 370.8H615"/>
<text class="small" x="191.8" y="460" text-anchor="middle">114.5</text>
<text class="small" x="76" y="374.8" text-anchor="end">0.3221</text>
<path class="grid" d="M297.6 94V440 M86 301.6H615"/>
<text class="small" x="297.6" y="460" text-anchor="middle">186.8</text>
<text class="small" x="76" y="305.6" text-anchor="end">0.3578</text>
<path class="grid" d="M403.4 94V440 M86 232.4H615"/>
<text class="small" x="403.4" y="460" text-anchor="middle">259.0</text>
<text class="small" x="76" y="236.4" text-anchor="end">0.3935</text>
<path class="grid" d="M509.2 94V440 M86 163.2H615"/>
<text class="small" x="509.2" y="460" text-anchor="middle">331.3</text>
<text class="small" x="76" y="167.2" text-anchor="end">0.4292</text>
<path class="grid" d="M615.0 94V440 M86 94.0H615"/>
<text class="small" x="615.0" y="460" text-anchor="middle">403.5</text>
<text class="small" x="76" y="98.0" text-anchor="end">0.4649</text>
<path class="axis" fill="none" d="M86 94V440H615"/>
<text x="350.5" y="491" text-anchor="middle">End-to-end p95 latency (ms)</text>
<text transform="translate(24 267.0) rotate(-90)" text-anchor="middle">NDCG@10</text>
<text x="657" y="100">Variants; green marks the Pareto frontier.</text>
<polyline points="137.2,406.5 167.8,285.2 168.6,282.8 219.8,244.1 251.5,216.9 395.5,193.1 563.8,127.5" fill="none" stroke="#087859" stroke-width="2"/>
<circle cx="563.8" cy="127.5" r="5" fill="#43628b" stroke="#087859" stroke-width="2"><title>Voyage rerank-3 over ANN + BM25 (default): 368.588 ms, 0.447618 NDCG</title></circle>
<circle cx="664" cy="121" r="4" fill="#43628b" stroke="#087859" stroke-width="2"/>
<text x="677" y="125">1. Voyage rerank-3 over ANN + BM25</text>
<circle cx="395.5" cy="193.1" r="5" fill="#43628b" stroke="#087859" stroke-width="2"><title>Typed + computed reranker (default): 253.673 ms, 0.413766 NDCG</title></circle>
<circle cx="664" cy="146" r="4" fill="#43628b" stroke="#087859" stroke-width="2"/>
<text x="677" y="150">2. Typed + computed reranker</text>
<circle cx="414.1" cy="203.7" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Computed-feature reranker (default): 266.371 ms, 0.408303 NDCG</title></circle>
<circle cx="664" cy="171" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="175">3. Computed-feature reranker</text>
<circle cx="251.5" cy="216.9" r="5" fill="#43628b" stroke="#087859" stroke-width="2"><title>Learned pairwise reranker (default): 155.292 ms, 0.401521 NDCG</title></circle>
<circle cx="664" cy="196" r="4" fill="#43628b" stroke="#087859" stroke-width="2"/>
<text x="677" y="200">4. Learned pairwise reranker</text>
<circle cx="265.1" cy="228.3" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Identifier-gated RRF (default): 164.617 ms, 0.395633 NDCG</title></circle>
<circle cx="664" cy="221" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="225">5. Identifier-gated RRF</text>
<circle cx="362.3" cy="241.6" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Deterministic product reranker (default): 230.992 ms, 0.388788 NDCG</title></circle>
<circle cx="664" cy="246" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="250">6. Deterministic product reranker</text>
<circle cx="276.1" cy="243.4" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>RMS stack + fuzzy-position boost 0.15 (default): 172.131 ms, 0.387839 NDCG</title></circle>
<circle cx="664" cy="271" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="275">7. RMS stack + fuzzy-position boost 0.15</text>
<circle cx="219.8" cy="244.1" r="5" fill="#43628b" stroke="#087859" stroke-width="2"><title>RMS lexical candidate stack (default): 133.637 ms, 0.387483 NDCG</title></circle>
<circle cx="664" cy="296" r="4" fill="#43628b" stroke="#087859" stroke-width="2"/>
<text x="677" y="300">8. RMS lexical candidate stack</text>
<circle cx="265.0" cy="247.6" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Min-max score fusion (default): 164.557 ms, 0.385665 NDCG</title></circle>
<circle cx="664" cy="321" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="325">9. Min-max score fusion</text>
<circle cx="316.1" cy="256.2" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>2:1 Voyage-4 + BM25 RRF (default): 199.397 ms, 0.38125 NDCG</title></circle>
<circle cx="664" cy="346" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="350">10. 2:1 Voyage-4 + BM25 RRF</text>
<circle cx="168.6" cy="282.8" r="5" fill="#43628b" stroke="#087859" stroke-width="2"><title>Passage BM25 + fuzzy title/brand (default): 98.7065 ms, 0.367539 NDCG</title></circle>
<circle cx="664" cy="371" r="4" fill="#43628b" stroke="#087859" stroke-width="2"/>
<text x="677" y="375">11. Passage BM25 + fuzzy title/brand</text>
<circle cx="167.8" cy="285.2" r="5" fill="#43628b" stroke="#087859" stroke-width="2"><title>Title + locale-aware passage BM25 (default): 98.1558 ms, 0.366266 NDCG</title></circle>
<circle cx="664" cy="396" r="4" fill="#43628b" stroke="#087859" stroke-width="2"/>
<text x="677" y="400">12. Title + locale-aware passage BM25</text>
<circle cx="356.6" cy="285.4" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Four-channel RRF (default): 227.117 ms, 0.366159 NDCG</title></circle>
<circle cx="664" cy="421" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="425">13. Four-channel RRF</text>
<circle cx="259.0" cy="288.9" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Baseline: Voyage-4 ANN (Turbopuffer) (default): 160.414 ms, 0.364371 NDCG</title></circle>
<circle cx="664" cy="446" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="450">14. Baseline: Voyage-4 ANN (Turbopuffer)</text>
<circle cx="137.2" cy="406.5" r="5" fill="#43628b" stroke="#087859" stroke-width="2"><title>Baseline: weighted title/description BM25 (default): 77.2491 ms, 0.303725 NDCG</title></circle>
<circle cx="664" cy="471" r="4" fill="#43628b" stroke="#087859" stroke-width="2"/>
<text x="677" y="475">15. Baseline: weighted title/description BM25</text>
