<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 435" role="img" aria-labelledby="title desc">
<title id="title">ESCI relevance and latency Pareto frontier</title>
<desc id="desc">p95 latency in milliseconds versus NDCG at 10. Lower latency and higher NDCG are better.</desc>
<style>text{font:14px system-ui,sans-serif;fill:#172438}.small{font-size:12px;fill:#43546b}.heading{font-size:23px;font-weight:bold}.axis{stroke:#73829a}.grid{stroke:#dfe6ee}</style>
<rect width="100%" height="100%" rx="12" fill="#f6f8fb"/>
<text x="32" y="40" class="heading">ESCI relevance vs. latency</text>
<text x="32" y="64" class="small">12 measured; 0 pending. Faster and more relevant is upper left.</text>
<path class="grid" d="M86.0 94V365 M86 365.0H615"/>
<text class="small" x="86.0" y="385" text-anchor="middle">50.8</text>
<text class="small" x="76" y="369.0" text-anchor="end">0.3007</text>
<path class="grid" d="M191.8 94V365 M86 310.8H615"/>
<text class="small" x="191.8" y="385" text-anchor="middle">95.4</text>
<text class="small" x="76" y="314.8" text-anchor="end">0.3267</text>
<path class="grid" d="M297.6 94V365 M86 256.6H615"/>
<text class="small" x="297.6" y="385" text-anchor="middle">140.0</text>
<text class="small" x="76" y="260.6" text-anchor="end">0.3528</text>
<path class="grid" d="M403.4 94V365 M86 202.4H615"/>
<text class="small" x="403.4" y="385" text-anchor="middle">184.7</text>
<text class="small" x="76" y="206.4" text-anchor="end">0.3788</text>
<path class="grid" d="M509.2 94V365 M86 148.2H615"/>
<text class="small" x="509.2" y="385" text-anchor="middle">229.3</text>
<text class="small" x="76" y="152.2" text-anchor="end">0.4048</text>
<path class="grid" d="M615.0 94V365 M86 94.0H615"/>
<text class="small" x="615.0" y="385" text-anchor="middle">273.9</text>
<text class="small" x="76" y="98.0" text-anchor="end">0.4308</text>
<path class="axis" fill="none" d="M86 94V365H615"/>
<text x="350.5" y="416" text-anchor="middle">End-to-end p95 latency (ms)</text>
<text transform="translate(24 229.5) rotate(-90)" text-anchor="middle">NDCG@10</text>
<text x="657" y="100">Variants · green = Pareto frontier</text>
<polyline points="137.2,338.8 154.7,210.9 218.2,208.5 303.3,175.3 372.7,155.1 455.2,146.1 476.4,120.2" fill="none" stroke="#087859" stroke-width="2"/>
<circle cx="476.4" cy="120.2" r="5" fill="#087859"><title>Typed + computed reranker: 215.458 ms, 0.418249 NDCG</title></circle>
<circle cx="664" cy="121" r="4" fill="#087859"/>
<text x="677" y="125">1. Typed + computed reranker</text>
<circle cx="563.8" cy="129.0" r="5" fill="#43628b"><title>Computed-feature reranker: 252.302 ms, 0.414046 NDCG</title></circle>
<circle cx="664" cy="146" r="4" fill="#43628b"/>
<text x="677" y="150">2. Computed-feature reranker</text>
<circle cx="455.2" cy="146.1" r="5" fill="#087859"><title>Learned pairwise reranker: 206.485 ms, 0.405824 NDCG</title></circle>
<circle cx="664" cy="171" r="4" fill="#087859"/>
<text x="677" y="175">3. Learned pairwise reranker</text>
<circle cx="372.7" cy="155.1" r="5" fill="#087859"><title>Identifier-gated RRF: 171.69 ms, 0.401517 NDCG</title></circle>
<circle cx="664" cy="196" r="4" fill="#087859"/>
<text x="677" y="200">4. Identifier-gated RRF</text>
<circle cx="402.0" cy="174.7" r="5" fill="#43628b"><title>Deterministic product reranker: 184.079 ms, 0.392091 NDCG</title></circle>
<circle cx="664" cy="221" r="4" fill="#43628b"/>
<text x="677" y="225">5. Deterministic product reranker</text>
<circle cx="303.3" cy="175.3" r="5" fill="#087859"><title>Min-max score fusion: 142.443 ms, 0.391799 NDCG</title></circle>
<circle cx="664" cy="246" r="4" fill="#087859"/>
<text x="677" y="250">6. Min-max score fusion</text>
<circle cx="458.0" cy="190.4" r="5" fill="#43628b"><title>2:1 Voyage-4 + BM25 RRF: 207.698 ms, 0.384535 NDCG</title></circle>
<circle cx="664" cy="271" r="4" fill="#43628b"/>
