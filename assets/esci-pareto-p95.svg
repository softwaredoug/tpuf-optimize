<text class="small" x="297.6" y="410" text-anchor="middle">188.7</text>
<text class="small" x="76" y="275.6" text-anchor="end">0.3672</text>
<path class="grid" d="M403.4 94V390 M86 212.4H615"/>
<text class="small" x="403.4" y="410" text-anchor="middle">265.4</text>
<text class="small" x="76" y="216.4" text-anchor="end">0.4028</text>
<path class="grid" d="M509.2 94V390 M86 153.2H615"/>
<text class="small" x="509.2" y="410" text-anchor="middle">342.1</text>
<text class="small" x="76" y="157.2" text-anchor="end">0.4384</text>
<path class="grid" d="M615.0 94V390 M86 94.0H615"/>
<text class="small" x="615.0" y="410" text-anchor="middle">418.9</text>
<text class="small" x="76" y="98.0" text-anchor="end">0.4740</text>
<path class="axis" fill="none" d="M86 94V390H615"/>
<text x="350.5" y="441" text-anchor="middle">End-to-end p95 latency (ms)</text>
<text transform="translate(24 242.0) rotate(-90)" text-anchor="middle">NDCG@10</text>
<text x="657" y="100">Variants · green = Pareto frontier</text>
<polyline points="137.2,361.4 147.4,259.2 184.3,257.2 233.8,230.7 274.1,214.6 322.1,207.4 334.5,186.7 563.8,122.6" fill="none" stroke="#087859" stroke-width="2"/>
<circle cx="563.8" cy="122.6" r="5" fill="#087859"><title>Voyage rerank-3 over ANN + BM25: 381.749 ms, 0.456769 NDCG</title></circle>
<circle cx="664" cy="121" r="4" fill="#087859"/>
<text x="677" y="125">1. Voyage rerank-3 over ANN + BM25</text>
<circle cx="334.5" cy="186.7" r="5" fill="#087859"><title>Typed + computed reranker: 215.458 ms, 0.418249 NDCG</title></circle>
<circle cx="664" cy="146" r="4" fill="#087859"/>
