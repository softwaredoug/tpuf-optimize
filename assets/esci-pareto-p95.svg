<text class="small" x="403.4" y="510" text-anchor="middle">256.2</text>
<text class="small" x="76" y="256.4" text-anchor="end">0.3935</text>
<path class="grid" d="M509.2 94V490 M86 173.2H615"/>
<text class="small" x="509.2" y="510" text-anchor="middle">330.3</text>
<text class="small" x="76" y="177.2" text-anchor="end">0.4292</text>
<path class="grid" d="M615.0 94V490 M86 94.0H615"/>
<text class="small" x="615.0" y="510" text-anchor="middle">404.4</text>
<text class="small" x="76" y="98.0" text-anchor="end">0.4649</text>
<path class="axis" fill="none" d="M86 94V490H615"/>
<text x="350.5" y="541" text-anchor="middle">End-to-end p95 latency (ms)</text>
<text transform="translate(24 292.0) rotate(-90)" text-anchor="middle">NDCG@10</text>
<text x="657" y="100">Variants; green marks the Pareto frontier.</text>
<polyline points="137.2,311.2 178.5,310.0 180.8,292.5 228.4,265.8 259.3,234.6 399.8,207.5 563.8,132.3" fill="none" stroke="#087859" stroke-width="2"/>
<circle cx="563.8" cy="132.3" r="5" fill="#43628b" stroke="#087859" stroke-width="2"><title>Voyage rerank-3 over ANN + BM25 (default): 368.588 ms, 0.447618 NDCG</title></circle>
<circle cx="664" cy="121" r="4" fill="#43628b" stroke="#087859" stroke-width="2"/>
<text x="677" y="125">1. Voyage rerank-3 over ANN + BM25</text>
<circle cx="399.8" cy="207.5" r="5" fill="#43628b" stroke="#087859" stroke-width="2"><title>Typed + computed reranker (default): 253.673 ms, 0.413766 NDCG</title></circle>
<circle cx="664" cy="146" r="4" fill="#43628b" stroke="#087859" stroke-width="2"/>
<text x="677" y="150">2. Typed + computed reranker</text>
<circle cx="417.9" cy="219.6" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Computed-feature reranker (default): 266.371 ms, 0.408303 NDCG</title></circle>
<circle cx="664" cy="171" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="175">3. Computed-feature reranker</text>
<circle cx="259.3" cy="234.6" r="5" fill="#43628b" stroke="#087859" stroke-width="2"><title>Learned pairwise reranker (default): 155.292 ms, 0.401521 NDCG</title></circle>
<circle cx="664" cy="196" r="4" fill="#43628b" stroke="#087859" stroke-width="2"/>
<text x="677" y="200">4. Learned pairwise reranker</text>
<circle cx="272.6" cy="247.7" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Identifier-gated RRF (default): 164.617 ms, 0.395633 NDCG</title></circle>
<circle cx="664" cy="221" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="225">5. Identifier-gated RRF</text>
<circle cx="367.4" cy="262.9" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Deterministic product reranker (default): 230.992 ms, 0.388788 NDCG</title></circle>
<circle cx="664" cy="246" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="250">6. Deterministic product reranker</text>
<circle cx="283.3" cy="265.0" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>RMS stack + fuzzy-position boost 0.15 (default): 172.131 ms, 0.387839 NDCG</title></circle>
<circle cx="664" cy="271" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="275">7. RMS stack + fuzzy-position boost 0.15</text>
<circle cx="228.4" cy="265.8" r="5" fill="#43628b" stroke="#087859" stroke-width="2"><title>RMS lexical candidate stack (default): 133.637 ms, 0.387483 NDCG</title></circle>
<circle cx="664" cy="296" r="4" fill="#43628b" stroke="#087859" stroke-width="2"/>
<text x="677" y="300">8. RMS lexical candidate stack</text>
<circle cx="272.5" cy="269.8" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Min-max score fusion (default): 164.557 ms, 0.385665 NDCG</title></circle>
<circle cx="664" cy="321" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="325">9. Min-max score fusion</text>
<circle cx="322.3" cy="279.6" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>2:1 Voyage-4 + BM25 RRF (default): 199.397 ms, 0.38125 NDCG</title></circle>
<circle cx="664" cy="346" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="350">10. 2:1 Voyage-4 + BM25 RRF</text>
<circle cx="180.8" cy="292.5" r="5" fill="#43628b" stroke="#087859" stroke-width="2"><title>One-request BM25 + local lexical reranker (default): 100.32 ms, 0.375427 NDCG</title></circle>
<circle cx="664" cy="371" r="4" fill="#43628b" stroke="#087859" stroke-width="2"/>
<text x="677" y="375">11. One-request BM25 + local lexical reranker</text>
<circle cx="178.5" cy="310.0" r="5" fill="#43628b" stroke="#087859" stroke-width="2"><title>Passage BM25 + fuzzy title/brand (default): 98.7065 ms, 0.367539 NDCG</title></circle>
<circle cx="664" cy="396" r="4" fill="#43628b" stroke="#087859" stroke-width="2"/>
<text x="677" y="400">12. Passage BM25 + fuzzy title/brand</text>
<circle cx="137.2" cy="311.2" r="5" fill="#43628b" stroke="#087859" stroke-width="2"><title>One-request composite BM25 (title + passage + brand) (default): 69.7504 ms, 0.36703 NDCG</title></circle>
<circle cx="664" cy="421" r="4" fill="#43628b" stroke="#087859" stroke-width="2"/>
<text x="677" y="425">13. One-request composite BM25 (title + passage + brand)</text>
<circle cx="177.7" cy="312.9" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Title + locale-aware passage BM25 (default): 98.1558 ms, 0.366266 NDCG</title></circle>
<circle cx="664" cy="446" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="450">14. Title + locale-aware passage BM25</text>
<circle cx="361.8" cy="313.1" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Four-channel RRF (default): 227.117 ms, 0.366159 NDCG</title></circle>
<circle cx="664" cy="471" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="475">15. Four-channel RRF</text>
<circle cx="266.6" cy="317.1" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Baseline: Voyage-4 ANN (Turbopuffer) (default): 160.414 ms, 0.364371 NDCG</title></circle>
<circle cx="664" cy="496" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="500">16. Baseline: Voyage-4 ANN (Turbopuffer)</text>
<circle cx="147.9" cy="451.7" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Baseline: weighted title/description BM25 (default): 77.2491 ms, 0.303725 NDCG</title></circle>
<circle cx="664" cy="521" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="525">17. Baseline: weighted title/description BM25</text>
