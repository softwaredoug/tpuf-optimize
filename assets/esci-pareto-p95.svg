<text x="350.5" y="516" text-anchor="middle">End-to-end p95 latency (ms)</text>
<text transform="translate(24 279.5) rotate(-90)" text-anchor="middle">NDCG@10</text>
<text x="657" y="100">Cohorts use separate Pareto frontiers; do not compare their scores as paired measurements.</text>
