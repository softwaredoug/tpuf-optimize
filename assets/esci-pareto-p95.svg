<circle cx="154.7" cy="210.9" r="5" fill="#087859"><title>Title + locale-aware passage BM25: 79.778 ms, 0.374687 NDCG</title></circle>
<circle cx="664" cy="321" r="4" fill="#087859"/>
<text x="677" y="325">9. Title + locale-aware passage BM25</text>
<circle cx="448.8" cy="212.2" r="5" fill="#43628b"><title>Four-channel RRF: 203.817 ms, 0.374075 NDCG</title></circle>
<circle cx="664" cy="346" r="4" fill="#43628b"/>
<text x="677" y="350">10. Four-channel RRF</text>
<circle cx="260.6" cy="235.6" r="5" fill="#43628b"><title>Baseline: Voyage-4 ANN (Turbopuffer): 124.408 ms, 0.362857 NDCG</title></circle>
<circle cx="664" cy="371" r="4" fill="#43628b"/>
<text x="677" y="375">11. Baseline: Voyage-4 ANN (Turbopuffer)</text>
<circle cx="137.2" cy="338.8" r="5" fill="#087859"><title>Baseline: weighted title/description BM25: 72.3788 ms, 0.313306 NDCG</title></circle>
<circle cx="664" cy="396" r="4" fill="#087859"/>
<text x="677" y="400">12. Baseline: weighted title/description BM25</text>
