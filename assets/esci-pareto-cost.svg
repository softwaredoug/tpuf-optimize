<circle cx="86.1" cy="285.4" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Four-channel RRF (default): 0.0016352 ms, 0.366159 NDCG</title></circle>
<circle cx="664" cy="421" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="425">13. Four-channel RRF</text>
<circle cx="86.1" cy="288.9" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Baseline: Voyage-4 ANN (Turbopuffer) (default): 0.0016352 ms, 0.364371 NDCG</title></circle>
<circle cx="664" cy="446" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="450">14. Baseline: Voyage-4 ANN (Turbopuffer)</text>
<circle cx="86.0" cy="406.5" r="5" fill="#43628b" stroke="#43628b" stroke-width="2"><title>Baseline: weighted title/description BM25 (default): 0 ms, 0.303725 NDCG</title></circle>
<circle cx="664" cy="471" r="4" fill="#43628b" stroke="#43628b" stroke-width="2"/>
<text x="677" y="475">15. Baseline: weighted title/description BM25</text>
