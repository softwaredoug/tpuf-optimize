<circle cx="227.3" cy="278.9" r="5" fill="#43628b"><title>Baseline: Voyage-4 ANN (Turbopuffer): 97.8453 ms, 0.362857 NDCG</title></circle>
<circle cx="664" cy="396" r="4" fill="#43628b"/>
