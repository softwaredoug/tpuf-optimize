<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 435" role="img" aria-labelledby="title desc">
<title id="title">ESCI relevance and latency Pareto frontier</title>
<desc id="desc">p50 latency in milliseconds versus NDCG at 10. Lower latency and higher NDCG are better.</desc>
<style>text{font:14px system-ui,sans-serif;fill:#172438}.small{font-size:12px;fill:#43546b}.heading{font-size:23px;font-weight:bold}.axis{stroke:#73829a}.grid{stroke:#dfe6ee}</style>
<rect width="100%" height="100%" rx="12" fill="#f6f8fb"/>
<text x="32" y="40" class="heading">ESCI relevance vs. latency</text>
<text x="32" y="64" class="small">12 measured; 0 pending. Faster and more relevant is upper left.</text>
<path class="grid" d="M86.0 94V365 M86 365.0H615"/>
<text class="small" x="86.0" y="385" text-anchor="middle">45.3</text>
<text class="small" x="76" y="369.0" text-anchor="end">0.3007</text>
<path class="grid" d="M191.8 94V365 M86 310.8H615"/>
<text class="small" x="191.8" y="385" text-anchor="middle">75.2</text>
<text class="small" x="76" y="314.8" text-anchor="end">0.3267</text>
<path class="grid" d="M297.6 94V365 M86 256.6H615"/>
<text class="small" x="297.6" y="385" text-anchor="middle">105.1</text>
<text class="small" x="76" y="260.6" text-anchor="end">0.3528</text>
<path class="grid" d="M403.4 94V365 M86 202.4H615"/>
<text class="small" x="403.4" y="385" text-anchor="middle">134.9</text>
<text class="small" x="76" y="206.4" text-anchor="end">0.3788</text>
<path class="grid" d="M509.2 94V365 M86 148.2H615"/>
<text class="small" x="509.2" y="385" text-anchor="middle">164.8</text>
<text class="small" x="76" y="152.2" text-anchor="end">0.4048</text>
<path class="grid" d="M615.0 94V365 M86 94.0H615"/>
<text class="small" x="615.0" y="385" text-anchor="middle">194.7</text>
<text class="small" x="76" y="98.0" text-anchor="end">0.4308</text>
<path class="axis" fill="none" d="M86 94V365H615"/>
<text x="350.5" y="416" text-anchor="middle">End-to-end p50 latency (ms)</text>
<text transform="translate(24 229.5) rotate(-90)" text-anchor="middle">NDCG@10</text>
<text x="657" y="100">Variants · green = Pareto frontier</text>
<polyline points="137.2,338.8 139.0,210.9 162.9,208.5 296.5,155.1 318.4,146.1 561.4,129.0 563.8,120.2" fill="none" stroke="#087859" stroke-width="2"/>
<circle cx="563.8" cy="120.2" r="5" fill="#087859"><title>Typed + computed reranker: 180.218 ms, 0.418249 NDCG</title></circle>
<circle cx="664" cy="121" r="4" fill="#087859"/>
<text x="677" y="125">1. Typed + computed reranker</text>
<circle cx="561.4" cy="129.0" r="5" fill="#087859"><title>Computed-feature reranker: 179.539 ms, 0.414046 NDCG</title></circle>
<circle cx="664" cy="146" r="4" fill="#087859"/>
<text x="677" y="150">2. Computed-feature reranker</text>
<circle cx="318.4" cy="146.1" r="5" fill="#087859"><title>Learned pairwise reranker: 110.938 ms, 0.405824 NDCG</title></circle>
<circle cx="664" cy="171" r="4" fill="#087859"/>
<text x="677" y="175">3. Learned pairwise reranker</text>
<circle cx="296.5" cy="155.1" r="5" fill="#087859"><title>Identifier-gated RRF: 104.753 ms, 0.401517 NDCG</title></circle>
<circle cx="664" cy="196" r="4" fill="#087859"/>
<text x="677" y="200">4. Identifier-gated RRF</text>
<circle cx="388.2" cy="174.7" r="5" fill="#43628b"><title>Deterministic product reranker: 130.644 ms, 0.392091 NDCG</title></circle>
<circle cx="664" cy="221" r="4" fill="#43628b"/>
<text x="677" y="225">5. Deterministic product reranker</text>
<circle cx="305.2" cy="175.3" r="5" fill="#43628b"><title>Min-max score fusion: 107.185 ms, 0.391799 NDCG</title></circle>
<circle cx="664" cy="246" r="4" fill="#43628b"/>
<text x="677" y="250">6. Min-max score fusion</text>
<circle cx="401.9" cy="190.4" r="5" fill="#43628b"><title>2:1 Voyage-4 + BM25 RRF: 134.496 ms, 0.384535 NDCG</title></circle>
<circle cx="664" cy="271" r="4" fill="#43628b"/>
<text x="677" y="275">7. 2:1 Voyage-4 + BM25 RRF</text>
<circle cx="162.9" cy="208.5" r="5" fill="#087859"><title>Passage BM25 + fuzzy title/brand: 67.0272 ms, 0.375884 NDCG</title></circle>
<circle cx="664" cy="296" r="4" fill="#087859"/>
<text x="677" y="300">8. Passage BM25 + fuzzy title/brand</text>
<circle cx="139.0" cy="210.9" r="5" fill="#087859"><title>Title + locale-aware passage BM25: 60.2766 ms, 0.374687 NDCG</title></circle>
<circle cx="664" cy="321" r="4" fill="#087859"/>
<text x="677" y="325">9. Title + locale-aware passage BM25</text>
<circle cx="368.5" cy="212.2" r="5" fill="#43628b"><title>Four-channel RRF: 125.085 ms, 0.374075 NDCG</title></circle>
<circle cx="664" cy="346" r="4" fill="#43628b"/>
<text x="677" y="350">10. Four-channel RRF</text>
<circle cx="272.1" cy="235.6" r="5" fill="#43628b"><title>Baseline: Voyage-4 ANN (Turbopuffer): 97.8453 ms, 0.362857 NDCG</title></circle>
<circle cx="664" cy="371" r="4" fill="#43628b"/>
<text x="677" y="375">11. Baseline: Voyage-4 ANN (Turbopuffer)</text>
<circle cx="137.2" cy="338.8" r="5" fill="#087859"><title>Baseline: weighted title/description BM25: 59.7613 ms, 0.313306 NDCG</title></circle>
<circle cx="664" cy="396" r="4" fill="#087859"/>
<text x="677" y="400">12. Baseline: weighted title/description BM25</text>
