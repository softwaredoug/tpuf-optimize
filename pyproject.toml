[project]
name = "tpuf-optimize"
version = "0.1.0"
description = "Experiments for indexing and querying Turbopuffer datasets"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "pandas>=2.2,<3",
    "tqdm>=4.70,<5",
    "turbopuffer>=2.10.2",
    "tpuf-helpers @ git+https://github.com/softwaredoug/tpuf-helpers.git@4723eadcc1b79b16e1b2f8c020651bc9a46b5a41",
    "cheat_at_search @ git+https://github.com/softwaredoug/cheat-at-search.git@f1ff0cc06cc0ecd0feff2da7a1bf087daf3faede",
]

[project.scripts]
index-esci = "tpuf_optimize.index_esci:main"
query = "tpuf_optimize.query_batch:main"

[dependency-groups]
dev = [
    "flake8>=7.3,<8",
    "pre-commit>=4.6,<5",
    "pyright>=1.1.408",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tpuf_optimize"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
